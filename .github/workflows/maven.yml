name: MediShield AI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medishield
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install and Start Backend Server
      run: |
        cd backend
        npm install
        echo "PORT=5000" > .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_USER=root" >> .env
        echo "DB_PASS=root" >> .env
        echo "DB_NAME=medishield" >> .env
        npm start &
        sleep 5 # Allow backend to sync tables and bind port

    - name: Install and Build Frontend React Client
      run: |
        cd frontend
        npm install
        npm run build
        npm run dev &
        sleep 3 # Allow dev server to bind port 5173

    - name: Execute Maven Verification (Unit + Integration + API + UI Tests)
      run: |
        mvn clean verify -Dapp.url=http://localhost:5173 -Dchrome.headless=true

    - name: Upload Extent Reports Artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: extents-automation-reports
        path: reports/

    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
